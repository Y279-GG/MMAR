function cupArt(){return `<div class="hero-art reveal" aria-hidden="true"><div class="orbit"><i class="orbit-dot"></i></div><i class="bean b1"></i><i class="bean b2"></i><i class="bean b3"></i><div class="cup-scene"><i class="steam s1"></i><i class="steam s2"></i><div class="coffee"></div><div class="cup-shape"></div></div></div>`}
function card(p){const q=cart[p.id]||0;return `<article class="card reveal"><h3>${nm(p)}</h3><div class="alt">${alt(p)}</div><div class="row"><span class="price">${fmt(p.price)}</span>${q?`<span class="step"><button data-a="dec" data-id="${p.id}" aria-label="Decrease">−</button><span>${q}</span><button data-a="inc" data-id="${p.id}" aria-label="Increase">+</button></span>`:`<button class="add" data-a="inc" data-id="${p.id}" aria-label="${t('add')} ${nm(p)}">+</button>`}</div></article>`}
function loc(){const hours=lang==='ar'?'يوميًا ٦:٣٠ ص – ١٠:٠٠ م':'Daily 6:30 AM – 10:00 PM';const tel=CONFIG.phone.replace(/\s/g,'');return `<section><div class="section-title reveal"><h2>${t('loc')}</h2><p>${lang==='ar'?'نستقبلكم بكل حب':'We look forward to welcoming you'}</p></div><div class="info"><dl class="reveal"><dt>${t('addr')}</dt><dd>${CONFIG.address[lang]}</dd><dt>${t('hrs')}</dt><dd>${hours}</dd><dt>${t('ph')}</dt><dd dir="ltr">${CONFIG.phone}</dd><div class="contact-links"><a class="contact-link" target="_blank" rel="noopener" href="${CONFIG.mapsUrl}">${t('dir')}</a><a class="contact-link" href="tel:${tel}">${t('call')}</a><a class="contact-link" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}">${t('wa')}</a></div></dl><div class="story-mark reveal reveal-delay"><small>MMAR · AL RABIYAH</small><strong>${lang==='ar'?'مرّ علينا، وخذ لك لحظة':'Drop by and take a moment'}</strong></div></div></section>`}
const V={home:()=>`<header class="hero wrap" id="home"><div class="hero-copy"><div class="eyebrow">${t('tag')}</div><h1>${t('h1')}</h1><p>${t('intro')}</p><div class="btns"><a class="btn fill" href="#menu">${t('b1')} <span>←</span></a><a class="btn" href="#about">${t('b2')}</a></div></div>${cupArt()}</header>${band()}<div class="wrap"><section class="story" id="about"><div class="reveal"><h2>${t('storyT')}</h2><p>${t('story1')}</p></div><div class="story-mark reveal reveal-delay"><small>MMAR · SPECIALTY COFFEE</small><strong>${t('story2')}</strong></div></section><section id="menu"><div class="section-title reveal"><h2>${t('feat')}</h2><p>01 / 03</p></div><div class="grid">${MENU.slice(0,4).map(card).join('')}</div><div class="btns"><a class="btn" href="#menu">${t('full')} <span>←</span></a></div></section></div><div class="exp"><div class="wrap"><div class="section-title reveal"><h2>${t('expT')}</h2></div><div class="three"><div class="reveal"><b>${t('e1')}</b><small>${t('e1d')}</small></div><div class="reveal reveal-delay"><b>${t('e2')}</b><small>${t('e2d')}</small></div><div class="reveal"><b>${t('e3')}</b><small>${t('e3d')}</small></div></div></div></div><div class="wrap">${loc()}</div>`,menu:()=>`<div class="wrap"><section><div class="section-title reveal"><h2>${t('menu')}</h2></div><div class="chips">${[{id:'all',ar:T.ar.all,en:T.en.all}].concat(CATS).map(c=>`<button class="chip ${filter===c.id?'on':''}" aria-pressed="${filter===c.id}" data-a="filter" data-id="${c.id}">${lang==='ar'?c.ar:c.en}</button>`).join('')}</div><div class="grid">${MENU.filter(p=>filter==='all'||p.cat===filter).map(card).join('')}</div></section></div><div class="wrap">${loc()}</div>`,about:()=>`<div class="wrap"><section class="story"><div class="reveal"><h2>${t('storyT')}</h2><p>${t('story1')}</p></div><div class="story-mark reveal reveal-delay"><small>MMAR · SPECIALTY COFFEE</small><strong>${t('story2')}</strong></div></section></div><div class="exp"><div class="wrap"><div class="section-title"><h2>${t('expT')}</h2></div><div class="three"><div><b>${t('e1')}</b><small>${t('e1d')}</small></div><div><b>${t('e2')}</b><small>${t('e2d')}</small></div><div><b>${t('e3')}</b><small>${t('e3d')}</small></div></div></div></div>`,contact:()=>`<div class="wrap">${loc()}</div>`,cart:()=>cartView()};
function cartView(){const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length)return `<div class="wrap"><section><h2>${t('cart')}</h2><p>${t('empty')}</p><div class="btns"><a class="btn fill" href="#menu">${t('b1')}</a></div></section></div>`;let sum=0;const rows=ids.map(i=>{const p=MENU.find(m=>m.id==i);if(!p)return '';sum+=p.price*cart[i];return `<div class="line"><div><b>${nm(p)}</b><div class="alt">${alt(p)}</div></div><span class="price">${fmt(p.price*cart[i])}</span><span class="step"><button data-a="dec" data-id="${p.id}">−</button><span>${cart[i]}</span><button data-a="inc" data-id="${p.id}">+</button></span></div>`}).join('');return `<div class="wrap"><section style="max-width:680px"><h2>${t('cart')}</h2>${rows}<div class="total"><span>${t('total')}</span><span>${fmt(sum)}</span></div><label>${t('name')}<input id="cn" autocomplete="name"></label><label>${t('notes')}<textarea id="cx" rows="3"></textarea></label><div class="btns"><button class="btn fill" data-a="send">${t('send')}</button></div><p class="note">${t('sendN')}</p></section></div>`}
let cur=(location.hash||'#home').slice(1)||'home';function cnt(){const n=Object.values(cart).reduce((a,b)=>a+(Number(b)||0),0);$('#cnt').textContent=n;return n}
function fab(v){const f=$('#fab');let total=0;for(const id in cart){const p=MENU.find(m=>m.id==id);if(p)total+=p.price*cart[id]}if(cnt()>0&&v!=='cart'){f.hidden=false;f.innerHTML=`<span>${t('cart')} · ${cnt()}</span><b>${fmt(total)}　←</b>`;requestAnimationFrame(()=>f.classList.add('show'))}else{f.classList.remove('show');f.hidden=true}}
function chrome(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#links').innerHTML=['home','menu','about','contact'].map(k=>`<a href="#${k}" class="${cur===k?'on':''}">${t(k)}</a>`).join('');$('#lang').textContent=lang==='ar'?'EN':'عربي';$('#fa').innerHTML=`<b>ممر · MMAR</b><br>${t('tag')}<br>${CONFIG.address[lang]}`;$('#fb').innerHTML=`${t('rights')} · <a href="#menu">${t('menu')}</a>`;fab(cur)}
let revealObserver;function observeReveals(){if(revealObserver)revealObserver.disconnect();const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return}revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');revealObserver.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>revealObserver.observe(e))}
function render(){cur=(location.hash||'#home').slice(1)||'home';chrome();$('#app').innerHTML=(V[cur]||V.home)();$('#links').classList.remove('open');observeReveals();window.scrollTo({top:0,behavior:'instant'})}
function go(v){if(v==='cart'){cur='cart';history.pushState(null,'','#cart');render();return}if(!V[v])v='home';if(location.hash==='#'+v){render();return}location.hash=v}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1700)}
function send(){const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length)return;let sum=0;const lines=ids.map(i=>{const p=MENU.find(m=>m.id==i);sum+=p.price*cart[i];return `• ${p.ar} / ${p.en} × ${cart[i]} — ${fmt(p.price*cart[i])}`}).join('\n');const n=$('#cn')?.value.trim()||'',x=$('#cx')?.value.trim()||'';const msg=`طلب ممر / MMAR${n?'\nالاسم: '+n:''}\n\n${lines}\n\n${t('total')}: ${fmt(sum)}${x?'\nملاحظات: '+x:''}`;window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank','noopener')}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1)||'home');return}const b=e.target.closest('[data-a]');if(!b)return;const act=b.dataset.a,id=b.dataset.id;if(act==='inc'){cart[id]=(cart[id]||0)+1;save();render();toast(t('added'));const c=$('#cartb');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}else if(act==='dec'){cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];save();render()}else if(act==='filter'){filter=id;render()}else if(act==='send')send()});
$('#lang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';save();render()});$('#bg').addEventListener('click',()=>$('#links').classList.toggle('open'));window.addEventListener('hashchange',render);window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;$('#progress').style.transform=`scaleX(${max>0?scrollY/max:0})`;$('#nav').classList.toggle('scrolled',scrollY>12)},{passive:true});
render();
</script>
</body>
</html>
