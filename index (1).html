function fullmenu(){return `<section class="wrap" id="fullmenu"><div class="section-head reveal"><h2>${t('cartMenu')}</h2></div><div class="cat-tabs">${[{id:'all',ar:'الكل',en:'All'}].concat(CATS).map(c=>`<button class="chip ${filter===c.id?'active':''}" data-filter="${c.id}">${lang==='ar'?c.ar:c.en}</button>`).join('')}</div><div class="menu-grid">${MENU.filter(p=>filter==='all'||p.cat===filter).map(item).join('')}</div></section>`}
function render(){const h=location.hash;const page=h==='#fullmenu'?fullmenu():home();$('#app').innerHTML=page;updateChrome();reveal();window.scrollTo({top:0,behavior:'instant'})}
function reveal(){const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
function openCart(){updateCart();$('#drawer').classList.add('open');$('#shade').classList.add('open')}
function closeCart(){$('#drawer').classList.remove('open');$('#shade').classList.remove('open')}
function updateCart(){const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length){$('#cartContent').innerHTML=`<div class="drawer-head"><h2>${t('cartTitle')}</h2><button class="close" data-close>×</button></div><div class="empty">${t('empty')}</div>`;return}let sum=0;const lines=ids.map(i=>{const p=MENU.find(m=>m.id==i);sum+=p.price*cart[i];return `<div class="cart-line"><div><b>${nm(p)}</b><div style="font-size:13px;color:var(--brown)">${fmt(p.price)}</div></div><div class="stepper"><button data-dec="${p.id}">−</button><span>${cart[i]}</span><button data-inc="${p.id}">+</button></div></div>`}).join('');$('#cartContent').innerHTML=`<div class="drawer-head"><h2>${t('cartTitle')}</h2><button class="close" data-close>×</button></div>${lines}<div class="cart-total"><span>${t('total')}</span><span>${fmt(sum)}</span></div><div class="fields"><input id="custName" placeholder="${t('name')}"><textarea id="custNotes" placeholder="${t('notes')}"></textarea></div><button class="btn fill" id="sendOrder">${t('send')} ←</button>`}
function sendOrder(){const ids=Object.keys(cart).filter(i=>cart[i]>0);let sum=0;const list=ids.map(i=>{const p=MENU.find(m=>m.id==i);sum+=p.price*cart[i];return `• ${p.ar} × ${cart[i]} — ${fmt(p.price*cart[i])}`}).join('\n');const n=$('#custName')?.value.trim(),x=$('#custNotes')?.value.trim();const msg=`طلب ممر / MMAR${n?'\nالاسم: '+n:''}\n\n${list}\n\nالمجموع: ${fmt(sum)}${x?'\nملاحظات: '+x:''}`;window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-inc],[data-dec],[data-filter],[data-close],#sendOrder,.cart,a[href^="#"]');if(!a)return;const inc=a.dataset.inc,dec=a.dataset.dec,filterId=a.dataset.filter;if(inc){cart[inc]=(cart[inc]||0)+1;save();updateChrome();updateCart();render();toast(lang==='ar'?'تمت الإضافة':'Added');return}if(dec){cart[dec]=(cart[dec]||0)-1;if(cart[dec]<=0)delete cart[dec];save();updateChrome();updateCart();render();return}if(filterId){filter=filterId;render();return}if(a.hasAttribute('data-close')){closeCart();return}if(a.id==='sendOrder'){sendOrder();return}if(a.classList.contains('cart')){e.preventEvent?.();e.preventDefault();openCart();return}if(a.matches('a[href^="#"]')){e.preventDefault();const id=a.getAttribute('href').slice(1);if(id==='cart'){openCart();return}location.hash=id;$('#links').classList.remove('open')}});
window.addEventListener('hashchange',()=>{render();closeCart()});$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';save();updateChrome();render()} ;$('#menuBtn').onclick=()=>$('#links').classList.toggle('open');$('#shade').onclick=closeCart;document.getElementByListener;
$('#year').textContent=new Date().getFullYear();render();setTimeout(()=>$('#loader').classList.add('done'),900);addEventListener('load',()=>setTimeout(()=>$('#loader').classList.add('done'),500));
</script>
</body>
</html>
